services:
  frontend:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - matcha-net
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - matcha-net
    depends_on:
      - frontend 

  backend:
    build:
      context: .
      dockerfile: docker/nodejs/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - matcha-net

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - matcha-net

  data-base:
    image: postgres:16.6
    container_name: matcha-host
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - matcha-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  matcha-net:
    driver: bridge

volumes:
  postgres_data:
